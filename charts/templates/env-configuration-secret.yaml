{{- /*
raulstechtips: the Tenant config Secret (config.env), synced from Infisical.
The root user and password (and, with oidc.enabled, the client ID and secret) come from Infisical;
the other OIDC settings come from values. The lines and their order must stay the same, because a
change rewrites config.env (MinIO reads it at the next restart).
*/ -}}
{{- if not .Values.tenant.configSecret.existingSecret }}
{{- fail "tenant.configSecret.existingSecret must be true, because the config Secret comes from Infisical and never from chart values" }}
{{- end }}
{{- if and .Values.oidc.enabled (not .Values.oidc.configUrl) }}
{{- fail "oidc.configUrl is required when oidc.enabled is true" }}
{{- end }}
{{- $inf := .Values.infisical }}
{{- $name := include "minio.configSecretName" . }}
{{- $ref := dict }}
{{- range list "MINIO_ROOT_USER" "MINIO_ROOT_PASSWORD" "MINIO_IDENTITY_OPENID_CLIENT_ID" "MINIO_IDENTITY_OPENID_CLIENT_SECRET" }}
{{- $_ := set $ref . (printf "{{ .%s.Value }}" .) }}
{{- end }}
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  infisicalAuthRef:
    name: {{ required "infisical.authRef.name is required" $inf.authRef.name | quote }}
    namespace: {{ required "infisical.authRef.namespace is required" $inf.authRef.namespace | quote }}
  syncOptions:
    refreshInterval: {{ required "infisical.refreshInterval is required" $inf.refreshInterval | quote }}
  sources:
    - projectSlug: {{ required "infisical.projectSlug is required" $inf.projectSlug | quote }}
      environmentSlug: {{ required "infisical.environmentSlug is required" $inf.environmentSlug | quote }}
      secretPath: {{ required "infisical.secretPath is required" $inf.secretPath | quote }}
      recursive: {{ $inf.recursive }}
  targets:
    - name: {{ $name }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      secretType: Opaque
      # Orphan: no owner reference, so deleting this object (or losing Infisical) never deletes the Secret.
      creationPolicy: Orphan
      metadata:
        labels: {}
        annotations: {}
      template:
        engineVersion: v1
        data:
          config.env: |
            export MINIO_ROOT_USER={{ get $ref "MINIO_ROOT_USER" }}
            export MINIO_ROOT_PASSWORD={{ get $ref "MINIO_ROOT_PASSWORD" }}
            {{- with .Values.oidc }}
            {{- if .enabled }}
            export MINIO_IDENTITY_OPENID_CONFIG_URL={{ .configUrl }}
            export MINIO_IDENTITY_OPENID_CLIENT_ID={{ get $ref "MINIO_IDENTITY_OPENID_CLIENT_ID" }}
            export MINIO_IDENTITY_OPENID_CLIENT_SECRET={{ get $ref "MINIO_IDENTITY_OPENID_CLIENT_SECRET" }}
            export MINIO_IDENTITY_OPENID_SCOPES={{ .scopes | quote }}
            export MINIO_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC={{ .redirectUriDynamic }}
            export MINIO_IDENTITY_OPENID_DISPLAY_NAME={{ .displayName }}
            {{- end }}
            {{- end }}
