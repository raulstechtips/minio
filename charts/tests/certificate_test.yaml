suite: Server certificate
templates:
  - templates/certificate.yaml
release:
  name: minio-test
  namespace: test
values:
  - ../ci/all-on-values.yaml
tests:
  - it: issues the certificate from the internal CA with the 6 names
    asserts:
      - isKind: { of: Certificate }
      - equal: { path: metadata.name, value: s3-test-minio-certificate }
      - equal: { path: metadata.namespace, value: test }
      - equal: { path: spec.secretName, value: s3-test-minio-tls }
      - equal: { path: spec.duration, value: 8760h }
      - equal: { path: spec.renewBefore, value: 720h }
      - equal: { path: spec.subject.organizations, value: [raulstechtips] }
      - equal: { path: spec.issuerRef, value: { name: raulstechtips-internal-ca-issuer, kind: ClusterIssuer } }
      - equal:
          path: spec.dnsNames
          value:
            - minio.test
            - minio.test.svc
            - minio.test.svc.cluster.local
            - "*.s3-test-hl.test.svc.cluster.local"
            - "*.test.svc.cluster.local"
            - "*.s3-test.minio.test.svc.cluster.local"

  - it: renders no certificate when TLS is off
    set:
      tls.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
