suite: config.env from Infisical
templates:
  - templates/env-configuration-secret.yaml
release:
  name: minio-test
  namespace: test
tests:
  - it: writes only the root user and password when OIDC is off
    asserts:
      - isKind: { of: InfisicalStaticSecret }
      - equal: { path: metadata.name, value: minio-minio-env-configuration }
      - equal:
          path: spec.targets[0].template.data["config.env"]
          value: |
            export MINIO_ROOT_USER={{ .MINIO_ROOT_USER.Value }}
            export MINIO_ROOT_PASSWORD={{ .MINIO_ROOT_PASSWORD.Value }}

  - it: writes the 8 lines in the live order when OIDC is on
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - equal:
          path: spec.targets[0].template.data["config.env"]
          value: |
            export MINIO_ROOT_USER={{ .MINIO_ROOT_USER.Value }}
            export MINIO_ROOT_PASSWORD={{ .MINIO_ROOT_PASSWORD.Value }}
            export MINIO_IDENTITY_OPENID_CONFIG_URL=https://idp.example.test/realms/fake/.well-known/openid-configuration
            export MINIO_IDENTITY_OPENID_CLIENT_ID={{ .MINIO_IDENTITY_OPENID_CLIENT_ID.Value }}
            export MINIO_IDENTITY_OPENID_CLIENT_SECRET={{ .MINIO_IDENTITY_OPENID_CLIENT_SECRET.Value }}
            export MINIO_IDENTITY_OPENID_SCOPES="openid,profile,email"
            export MINIO_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC=on
            export MINIO_IDENTITY_OPENID_DISPLAY_NAME=Keycloak

  - it: reads the Infisical folder with the shared connection
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - equal: { path: spec.infisicalAuthRef, value: { name: fake-auth, namespace: fake-auth-namespace } }
      - equal: { path: spec.syncOptions.refreshInterval, value: 5m }
      - equal:
          path: spec.sources
          value: [{ projectSlug: fake-project, environmentSlug: fake-env, secretPath: /fake/minio, recursive: false }]

  - it: writes an ownerless Opaque Secret with the Tenant config name
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - equal: { path: 'spec.targets[0].name', value: s3-test-minio-env-configuration }
      - equal: { path: 'spec.targets[0].namespace', value: test }
      - equal: { path: 'spec.targets[0].kind', value: Secret }
      - equal: { path: 'spec.targets[0].secretType', value: Opaque }
      - equal: { path: 'spec.targets[0].creationPolicy', value: Orphan }
      - equal: { path: 'spec.targets[0].metadata', value: { labels: {}, annotations: {} } }
      - equal: { path: 'spec.targets[0].template.engineVersion', value: v1 }
